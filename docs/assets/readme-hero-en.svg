<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">XAgree</title>
  <desc id="desc">Mutual confirmation, separate copies, and local-first private records</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf9"/>
      <stop offset="0.56" stop-color="#fdf3f4"/>
      <stop offset="1" stop-color="#f7e5e9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef5967"/>
      <stop offset="1" stop-color="#c93f53"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#8f3040" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="40" fill="url(#background)"/>
  <circle cx="1450" cy="38" r="240" fill="#fff" opacity=".48"/>
  <circle cx="1515" cy="520" r="300" fill="#e7aab4" opacity=".16"/>
  <circle cx="75" cy="540" r="180" fill="#ef5967" opacity=".06"/>

  <g transform="translate(105 110)">
    <rect width="164" height="164" rx="42" fill="url(#accent)" filter="url(#shadow)"/>
    <path d="M82 61c-9-20-39-15-39 8 0 17 21 29 39 42 18-13 39-25 39-42 0-23-30-28-39-8Z" fill="#fff"/>
    <rect x="43" y="124" width="78" height="10" rx="5" fill="#fff" opacity=".96"/>
  </g>

  <g fill="#191518" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">
    <text x="324" y="168" font-size="44" font-weight="650" letter-spacing="4" fill="#cf4558">XAgree · LOCAL-FIRST</text>
    <text x="324" y="252" font-size="48" font-weight="760">A shared moment, kept between you</text>
    <text x="324" y="324" font-size="29" font-weight="450" fill="#6f6569">Speak in person. Confirm together. Keep your own record.</text>
  </g>

  <g transform="translate(324 380)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="22" font-weight="600">
    <g>
      <rect width="225" height="54" rx="27" fill="#fff" stroke="#ead8dc"/>
      <circle cx="30" cy="27" r="8" fill="#d3495b"/>
      <text x="52" y="35" fill="#51484b">Mutual confirmation</text>
    </g>
    <g transform="translate(245)">
      <rect width="190" height="54" rx="27" fill="#fff" stroke="#ead8dc"/>
      <circle cx="30" cy="27" r="8" fill="#d3495b"/>
      <text x="52" y="35" fill="#51484b">Separate copies</text>
    </g>
    <g transform="translate(455)">
      <rect width="160" height="54" rx="27" fill="#fff" stroke="#ead8dc"/>
      <circle cx="30" cy="27" r="8" fill="#4e8d6c"/>
      <text x="52" y="35" fill="#51484b">Local-first</text>
    </g>
  </g>

  <g transform="translate(1170 102)" filter="url(#shadow)">
    <g transform="rotate(-7 115 177)">
      <rect width="230" height="356" rx="46" fill="#fff" stroke="#e8d9dc" stroke-width="4"/>

      <rect x="24" y="66" width="182" height="60" rx="18" fill="#f5ecee"/>
      <rect x="24" y="146" width="182" height="78" rx="22" fill="#d64a5c"/>
      <rect x="44" y="170" width="100" height="12" rx="6" fill="#fff"/>
      <rect x="44" y="192" width="74" height="9" rx="5" fill="#fff" opacity=".72"/>
      <rect x="24" y="246" width="182" height="76" rx="20" fill="#faf6f7" stroke="#efe4e6"/>
      <circle cx="52" cy="273" r="12" fill="#d64a5c"/>
      <rect x="76" y="265" width="94" height="10" rx="5" fill="#70666a"/>
      <circle cx="52" cy="301" r="12" fill="#4e8d6c"/>
